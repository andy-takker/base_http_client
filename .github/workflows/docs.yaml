name: Deploy documentation

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Version label to deploy as latest (e.g. 0.7.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Deploy documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Publish documentation to gh-pages.
    steps:
      - name: Checkout master
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCS_VERSION: ${{ inputs.version }}
        run: |
          [[ "${DOCS_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/${DOCS_VERSION}")" = tag
          git fetch origin master
          git merge-base --is-ancestor \
            "refs/tags/${DOCS_VERSION}^{commit}" origin/master

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          checksum: "8cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b"
          python-version: "3.10"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-extras --group docs

      - name: Configure git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages --depth=1
          else
            STATUS=$?
            if test "${STATUS}" -ne 2; then
              exit "${STATUS}"
            fi
          fi

      - name: Deploy dev version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          uv run mike deploy --push --update-aliases dev

      - name: Deploy release version
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCS_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          uv run mike deploy --push --update-aliases "${DOCS_VERSION}" latest
          uv run mike set-default --push latest
