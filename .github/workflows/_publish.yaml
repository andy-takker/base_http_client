name: Publish Python distribution

on:
  workflow_call:
    inputs:
      version:
        description: Stable release version
        required: true
        type: string

permissions: {}

jobs:
  provenance:
    name: Attest package provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the provenance attestation.
      attestations: write # Publish build provenance.
    steps:
      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-dist
          path: dist/

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  publish-to-pypi:
    name: Publish distribution to PyPI
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write # Authenticate to PyPI with trusted publishing.
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          checksum: "8cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b"
          python-version: "3.10"
          enable-cache: false

      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-dist
          path: dist/

      - name: Validate release artifacts
        run: >-
          uv run python -m tools.release artifacts
          --version "${RELEASE_VERSION}"
          --directory dist
          --output dist/SHA256SUMS.json

      - name: Publish distribution to PyPI
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/ \
            dist/*.whl dist/*.tar.gz

  github-release:
    name: Sign artifacts and create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create the GitHub Release.
      id-token: write # Sign artifacts with Sigstore.
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          checksum: "8cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b"
          python-version: "3.10"
          enable-cache: false

      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-dist
          path: dist/

      - name: Validate release artifacts
        run: >-
          uv run python -m tools.release artifacts
          --version "${RELEASE_VERSION}"
          --directory dist
          --output dist/SHA256SUMS.json

      - name: Generate release notes
        run: >-
          uv run python -m tools.release notes
          --version "${RELEASE_VERSION}"
          --changelog CHANGELOG.md
          --output release-notes.md

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify release artifacts
        run: |
          set -euo pipefail
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/_publish.yaml@refs/tags/${RELEASE_VERSION}"
          for artifact in dist/*.whl dist/*.tar.gz; do
            bundle="${artifact}.sigstore.json"
            cosign sign-blob --yes --bundle "${bundle}" "${artifact}"
            cosign verify-blob \
              --bundle "${bundle}" \
              --certificate-identity "${certificate_identity}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${artifact}"
          done

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json="${RUNNER_TEMP}/github-release.json"
          if gh release view "${RELEASE_VERSION}" \
            --json assets,body,isDraft,isPrerelease,name,tagName \
            > "${release_json}"; then
            is_draft="$(jq -r '.isDraft' "${release_json}")"
            if [[ "${is_draft}" == "true" ]]; then
              gh release delete "${RELEASE_VERSION}" --yes
            elif [[ "${is_draft}" != "false" ]]; then
              echo "Existing release has an invalid draft state" >&2
              exit 1
            else
              existing_tag="$(jq -r '.tagName' "${release_json}")"
              existing_name="$(jq -r '.name' "${release_json}")"
              is_prerelease="$(jq -r '.isPrerelease' "${release_json}")"
              if [[ "${existing_tag}" != "${RELEASE_VERSION}" ]] ||
                [[ "${existing_name}" != "${RELEASE_VERSION}" ]] ||
                [[ "${is_prerelease}" != "false" ]]; then
                echo "Published release metadata does not match the verified release" >&2
                exit 1
              fi

              existing_notes="${RUNNER_TEMP}/github-release-notes.md"
              jq -j '.body' "${release_json}" > "${existing_notes}"
              if ! cmp --silent release-notes.md "${existing_notes}"; then
                echo "Published release notes do not match the verified release" >&2
                exit 1
              fi

              expected_assets="${RUNNER_TEMP}/expected-release-assets.txt"
              published_assets="${RUNNER_TEMP}/published-release-assets.txt"
              for asset in dist/*; do
                basename "${asset}"
              done | sort > "${expected_assets}"
              jq -r '.assets[].name' "${release_json}" |
                sort > "${published_assets}"
              if ! cmp --silent "${expected_assets}" "${published_assets}"; then
                echo "Published release assets do not match the verified release" >&2
                exit 1
              fi

              download_dir="${RUNNER_TEMP}/published-release-assets"
              mkdir "${download_dir}"
              gh release download "${RELEASE_VERSION}" --dir "${download_dir}"
              for asset in dist/*; do
                asset_name="$(basename "${asset}")"
                if [[ "${asset_name}" == *.sigstore.json ]]; then
                  continue
                fi
                if ! cmp --silent \
                  "${asset}" "${download_dir}/${asset_name}"; then
                  echo "Published release asset ${asset_name} differs from the verified artifact" >&2
                  exit 1
                fi
              done
              for artifact in dist/*.whl dist/*.tar.gz; do
                artifact_name="$(basename "${artifact}")"
                cosign verify-blob \
                  --bundle "${download_dir}/${artifact_name}.sigstore.json" \
                  --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/_publish.yaml@refs/tags/${RELEASE_VERSION}" \
                  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                  "${download_dir}/${artifact_name}"
              done
              exit 0
            fi
          fi

          gh release create "${RELEASE_VERSION}" \
            --verify-tag \
            --title "${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            dist/*
